[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-autogen"
version = "1.0.0"
description = "AI-powered blog and story automation tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pyyaml",
    "tqdm",
    "sqlalchemy",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "responses",
    "httpx",
]
